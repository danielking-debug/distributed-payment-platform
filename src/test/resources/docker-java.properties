# Docker Engine 29+ rejects clients below API 1.40.
# Testcontainers 1.20.x / older docker-java defaulted to 1.32 and failed with:
#   BadRequestException: client version 1.32 is too old. Minimum supported API version is 1.40
# Pin a version inside the daemon-supported window (1.40–1.54+).
api.version=1.44
