server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: distributed-payment-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_ledger}
    username: ${DB_USER:pll}
    password: ${DB_PASSWORD:pll}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: manual
      # M6 Phase 2: Micrometer Observation on @KafkaListener (W3C extract from headers)
      observation-enabled: true
    template:
      # M6 Phase 2: Observation on KafkaTemplate.send (W3C inject into headers)
      observation-enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

app:
  payments:
    submitted-topic: payments.submitted
    completed-topic: payments.completed
    failed-topic: payments.failed
    submitted-dlt-topic: payments.submitted.DLT
    completed-dlt-topic: payments.completed.DLT
    failed-dlt-topic: payments.failed.DLT
    partitions: 3
    idempotency-ttl-hours: 24
    balance-cache-ttl-seconds: 30
  kafka:
    consumer:
      retry:
        # ExponentialBackOff: first delay, then * multiplier, until max elapsed budget
        initial-interval-ms: 500
        multiplier: 2.0
        max-elapsed-ms: 10000
  outbox:
    poll-interval-ms: 100
    batch-size: 200
  reconciliation:
    lookback-hours: 24
    stuck-pending-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  # Phase 1: Micrometer Tracing + OTel. Sampling 1.0 is for local/dev visibility.
  # Override with TRACING_SAMPLING_PROBABILITY in higher environments.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      # Default points at local Jaeger OTLP HTTP (compose profile "observability").
      # App starts even if nothing listens here; export failures are non-fatal.
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    com.daniel.distributed: INFO
  pattern:
    # Micrometer Tracing populates MDC traceId/spanId when a span is active (W3C).
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId=%mdc{traceId:-} spanId=%mdc{spanId:-}] %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
