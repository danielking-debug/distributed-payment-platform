apiVersion: v1
kind: Secret
metadata:
  name: payment-platform-secret
  namespace: payment-platform
  labels:
    app.kubernetes.io/part-of: distributed-payment-platform
    app.kubernetes.io/name: payment-platform-secret
type: Opaque
# Replace REPLACE_ME_* placeholders with real credentials before applying this
# manifest. Do not commit real passwords. Key names must stay DB_USER / DB_PASSWORD
# (the app and Postgres manifests reference these keys).
stringData:
  DB_USER: "REPLACE_ME_DB_USER"
  DB_PASSWORD: "REPLACE_ME_DB_PASSWORD"
