# Single-node KRaft Kafka for local kind development.
# Independent PVC — not related to Docker Compose volumes or hostPath.
# Clients inside the cluster: KAFKA_BOOTSTRAP_SERVERS=kafka:9092 (ConfigMap).
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: payment-platform
  labels:
    app.kubernetes.io/part-of: distributed-payment-platform
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
spec:
  # Headless Service: stable DNS for StatefulSet (kafka-0.kafka.payment-platform.svc...)
  clusterIP: None
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
      protocol: TCP
    - name: controller
      port: 9093
      targetPort: controller
      protocol: TCP
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: payment-platform
  labels:
    app.kubernetes.io/part-of: distributed-payment-platform
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/component: messaging
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: distributed-payment-platform
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: messaging
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: plaintext
              containerPort: 9092
              protocol: TCP
            - name: controller
              containerPort: 9093
              protocol: TCP
          env:
            # --- Identity / KRaft (aligned with docker-compose.yml roles & CLUSTER_ID) ---
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: CLUSTER_ID
              value: "cGxsLWRlbW8tY2x1c3Rlci0x"
            # Single in-cluster client listener + controller (no host/NodePort listener)
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            # Single combined broker/controller on this pod
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # Topic defaults matching Compose (app uses 3 partitions; RF=1 for single node)
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            # Durable log directory on the PVC
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            # Conservative heap for ~7Gi available host RAM + kind + Postgres + Redis
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx256m"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          # tcpSocket probes: avoid heavyweight JVM CLI checks that time out on small kind nodes
          startupProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels:
          app.kubernetes.io/part-of: distributed-payment-platform
          app.kubernetes.io/name: kafka
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
